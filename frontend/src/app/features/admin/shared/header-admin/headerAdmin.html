<header class="header-admin bg-success text-white py-3 shadow-sm">
  <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
    <div class="d-flex align-items-center gap-3">
      <h1 class="h5 mb-0 fw-bold cursor-pointer" (click)="irHome()">Panel Admin</h1>

      <nav class="d-none d-md-flex gap-2">
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'home'" (click)="irHome()">
          <i class="bi bi-speedometer2 me-1"></i> Dashboard
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'lockers'" (click)="irLockers()">
          <i class="bi bi-box-seam me-1"></i> Lockers
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'incidencias'" (click)="irIncidencias()">
          <i class="bi bi-exclamation-triangle me-1"></i> Incidencias
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'tarifas'" (click)="irTarifas()">
          <i class="bi bi-currency-dollar me-1"></i> Tarifas
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'empresas'" (click)="irEmpresas()">
          <i class="bi bi-building me-1"></i> Empresas
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'tecnicos'" (click)="irTecnicos()">
          <i class="bi bi-tools me-1"></i> Técnicos
        </button>
      </nav>
    </div>

    <div class="d-flex align-items-center gap-2">
      <app-user-menu-button
          [userRole]="'Administrador'"
          [menuItems]="menuItems"
          [nombreUsuario]="nombreCompleto"
          [headerIcon]="'bi bi-person-badge text-success'"
          (logout)="logout()">
      </app-user-menu-button>
    </div>
  </div>
</header>
