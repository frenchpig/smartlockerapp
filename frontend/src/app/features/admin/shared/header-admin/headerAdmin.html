<header class="header-admin bg-success text-white py-3 shadow-sm">
  <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
    <div class="d-flex align-items-center gap-3">
      <h1 class="h5 mb-0 fw-bold cursor-pointer" (click)="irHome()">Panel Admin</h1>

      <nav class="d-none d-md-flex gap-2">
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'home'" (click)="irHome()">
          <i class="bi bi-speedometer2 me-1"></i> Dashboard
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'lockers'" (click)="irLockers()">
          <i class="bi bi-box-seam me-1"></i> Lockers
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'incidencias'" (click)="irIncidencias()">
          <i class="bi bi-exclamation-triangle me-1"></i> Incidencias
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'tarifas'" (click)="irTarifas()">
          <i class="bi bi-currency-dollar me-1"></i> Tarifas
        </button>
        <button class="nav-link-custom" type="button" [class.active]="vistaActual === 'empresas'" (click)="irEmpresas()">
          <i class="bi bi-building me-1"></i> Empresas
        </button>
      </nav>
    </div>

    <div class="d-flex align-items-center gap-2">
      <div class="dropdown user-dropdown">
        <button class="btn-user-menu d-inline-flex align-items-center gap-2" type="button"
          data-bs-toggle="dropdown" aria-expanded="false">
          <div class="user-avatar">
            <div class="avatar-circle">{{ inicialAvatar }}</div>
          </div>
          <div class="user-info d-none d-sm-flex flex-column align-items-start">
            <span class="user-name">{{ nombreCompleto }}</span>
            <span class="user-role">Administrador</span>
          </div>
          <i class="bi bi-chevron-down chevron-icon"></i>
        </button>
        <ul class="dropdown-menu dropdown-menu-end dropdown-menu-animated">
          <li class="dropdown-header">
            <div class="d-flex align-items-center gap-2">
              <i class="bi bi-person-badge fs-4 text-success"></i>
              <div>
                <div class="fw-semibold">{{ nombreCompleto }}</div>
                <small class="text-muted">{{ user()?.email || 'admin@email.com' }}</small>
              </div>
            </div>
          </li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item" type="button" (click)="irPerfil()">
            <i class="bi bi-person me-2"></i> Perfil
          </button></li>
          <li><button class="dropdown-item" type="button" (click)="irHome()">
            <i class="bi bi-speedometer2 me-2"></i> Dashboard
          </button></li>
          <li><button class="dropdown-item" type="button" (click)="irLockers()">
            <i class="bi bi-box-seam me-2"></i> Lockers
          </button></li>
          <li><button class="dropdown-item" type="button" (click)="irIncidencias()">
            <i class="bi bi-exclamation-triangle me-2"></i> Incidencias
          </button></li>
          <li><button class="dropdown-item" type="button" (click)="irEmpresas()">
            <i class="bi bi-building me-2"></i> Empresas
          </button></li>
          <li><button class="dropdown-item" type="button" (click)="irTarifas()">
            <i class="bi bi-currency-dollar me-2"></i> Tarifas
          </button></li>
          <li><hr class="dropdown-divider"></li>
          <li><button class="dropdown-item text-danger" type="button" (click)="logout()">
            <i class="bi bi-box-arrow-right me-2"></i> Cerrar sesión
          </button></li>
        </ul>
      </div>
    </div>
  </div>
</header>
