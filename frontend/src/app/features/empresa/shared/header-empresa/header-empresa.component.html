<header class="bg-success text-white py-3 shadow-sm">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <h1 class="h5 mb-0 fw-bold">{{ titulo }}</h1>

            <nav class="d-none d-md-flex gap-2">
                <a routerLink="/empresa" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    class="nav-link-custom">
                    <i class="bi bi-house-door me-1"></i> Panel
                </a>
                <a routerLink="/empresa/pedidos" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-box-seam me-1"></i> Pedidos
                </a>
                <a routerLink="/empresa/repartidores" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-people me-1"></i> Repartidores
                </a>
                <a routerLink="/empresa/EmpresaIncidencias" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-exclamation-triangle me-2"></i>Incidencias
                </a>
                <a routerLink="/empresa/productos" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-box me-1"></i> Productos
                </a>
            </nav>
        </div>

        <div class="d-flex align-items-center gap-2">
            <div class="dropdown user-dropdown">
                <button class="btn-user-menu dropdown-toggle d-inline-flex align-items-center gap-2" type="button"
                    data-bs-toggle="dropdown" aria-expanded="false">
                    <div class="user-avatar">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="user-info d-none d-sm-flex flex-column align-items-start">
                        <span class="user-name">{{ nombreCompleto }}</span>
                        <span class="user-role">Empresa</span>
                    </div>
                    <i class="bi bi-chevron-down chevron-icon"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-animated">
                    <li class="dropdown-header">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle fs-4"></i>
                            <div>
                                <div class="fw-semibold">{{ nombreCompleto }}</div>
                                <small class="text-muted">{{ user()?.email || 'empresa@email.com' }}</small>
                            </div>
                        </div>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa">
                            <i class="bi bi-house-door me-2"></i>Panel
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/pedidos">
                            <i class="bi bi-box-seam me-2"></i>Pedidos
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/repartidores">
                            <i class="bi bi-people me-2"></i>Repartidores
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/reservas/nueva">
                            <i class="bi bi-plus-circle me-2"></i>Nueva Reserva
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/EmpresaIncidencias">
                            <i class="bi bi-exclamation-triangle me-2"></i>Incidencias
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/productos">
                            <i class="bi bi-box me-2"></i>Productos
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/tarifaEmpresa">
                            <i class="bi bi-cash me-2"></i>Planes
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/empresa/PerfilEmpresa">
                            <i class="bi bi-person me-2"></i>Perfil
                        </a>
                    </li>
                    <li>
                        <hr class="dropdown-divider">
                    </li>
                    <li>
                        <button class="dropdown-item text-danger" type="button" (click)="onLogout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
