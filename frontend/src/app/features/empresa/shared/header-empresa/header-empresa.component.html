<header class="bg-success text-white py-3 shadow-sm">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <h1 class="h5 mb-0 fw-bold">{{ titulo }}</h1>

            <nav class="d-none d-md-flex gap-2">
                <a routerLink="/empresa" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    class="nav-link-custom">
                    <i class="bi bi-house-door me-1"></i> Panel
                </a>
                <a routerLink="/empresa/pedidos" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-box-seam me-1"></i> Pedidos
                </a>
                <a routerLink="/empresa/repartidores" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-people me-1"></i> Repartidores
                </a>
                <a routerLink="/empresa/EmpresaIncidencias" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-exclamation-triangle me-2"></i>Incidencias
                </a>
                <a routerLink="/empresa/productos" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-box me-1"></i> Productos
                </a>
            </nav>
        </div>

        <div class="d-flex align-items-center gap-2">
            <app-user-menu-button
                [userRole]="'Empresa'"
                [menuItems]="menuItems"
                [nombreUsuario]="nombreCompleto"
                (logout)="onLogout()">
            </app-user-menu-button>
        </div>
    </div>
</header>
