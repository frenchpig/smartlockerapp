<div class="device-login-container">
  <div class="login-box">
    <h1>Acceso Dispositivo</h1>
    <p class="subtitle">Ingrese las credenciales del totem</p>

    <form (ngSubmit)="enviar()" class="login-form">
      <div class="form-group">
        <label for="username">Usuario</label>
        <input 
          id="username"
          type="text" 
          [formControl]="username"
          placeholder="totem-nunoa"
          [disabled]="enviando"
        />
      </div>

      <div class="form-group">
        <label for="password">Contraseña</label>
        <input 
          id="password"
          type="password" 
          [formControl]="password"
          placeholder="••••••••"
          [disabled]="enviando"
        />
      </div>

      <div *ngIf="errorMsg" class="error-msg">
        {{ errorMsg }}
      </div>

      <button type="button" (click)="enviar()" [disabled]="enviando || !username.valid || !password.valid" class="btn-login">
        <span *ngIf="!enviando">Entrar</span>
        <span *ngIf="enviando">Cargando...</span>
      </button>
    </form>
  </div>
</div>
