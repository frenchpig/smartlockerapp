<div class="totem-container">
  <div class="totem-box">
    <header class="totem-header">
      <div class="header-top">
        <h1>Smart Lockers</h1>
        <button type="button" class="btn-logout" (click)="cerrarSesion()">
          Cerrar Sesión
        </button>
      </div>
      <p class="subtitle">Ingresa el código temporal mostrado al cliente.</p>
      <p *ngIf="ubicacion()" class="location">
        <span class="location-icon">📍</span> {{ ubicacion()?.nombre }}
      </p>
    </header>

    <section class="code-section">
      <h2 class="section-title">Código temporal</h2>

      <!-- Display de dígitos -->
      <div class="code-display">
        <span
          class="code-digit"
          *ngFor="let i of [0,1,2,3,4,5]"
          [class.filled]="(clave.value.length) > i"
        >
          {{ clave.value[i] || '•' }}
        </span>
      </div>

      <!-- Keypad -->
      <div class="keypad">
        <button type="button" class="keypad-btn" (click)="press('1')">1</button>
        <button type="button" class="keypad-btn" (click)="press('2')">2</button>
        <button type="button" class="keypad-btn" (click)="press('3')">3</button>
        <button type="button" class="keypad-btn" (click)="press('4')">4</button>
        <button type="button" class="keypad-btn" (click)="press('5')">5</button>
        <button type="button" class="keypad-btn" (click)="press('6')">6</button>
        <button type="button" class="keypad-btn" (click)="press('7')">7</button>
        <button type="button" class="keypad-btn" (click)="press('8')">8</button>
        <button type="button" class="keypad-btn" (click)="press('9')">9</button>
        <button type="button" class="keypad-btn keypad-btn-secondary" (click)="limpiar()" [disabled]="enviando">Limpiar</button>
        <button type="button" class="keypad-btn" (click)="press('0')">0</button>
        <button type="button" class="keypad-btn keypad-btn-secondary" (click)="borrar()" [disabled]="enviando">Borrar</button>
      </div>

      <!-- Botón validar -->
      <button type="button" class="btn-validate" [disabled]="!lleno || enviando" (click)="enviar()">
        <span *ngIf="!enviando">Validar código</span>
        <span *ngIf="enviando">Validando...</span>
      </button>
    </section>

    <!-- Mensajes -->
    <div *ngIf="errorMsg" class="alert-error">
      {{ errorMsg }}
    </div>

    <div *ngIf="exito" class="alert-success">
      <h3>✅ Código correcto</h3>
      <p>
        Reserva #{{ exito.reserva_id }} • Locker {{ exito.locker?.numero ?? 'N/D' }}
        <span *ngIf="exito.locker?.ubicacion">en {{ exito.locker?.ubicacion }}</span>
      </p>
    </div>
  </div>
</div>
