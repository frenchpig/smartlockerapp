<header class="bg-success text-white py-3 shadow-sm">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <h1 class="h5 mb-0 fw-bold">{{ titulo }}</h1>
            
            <nav class="d-none d-md-flex gap-2">
                <a routerLink="/repartidor" 
                   routerLinkActive="active" 
                   [routerLinkActiveOptions]="{exact: true}"
                   class="nav-link-custom">
                    <i class="bi bi-box-seam me-1"></i> Asignaciones
                </a>
            </nav>
        </div>

        <div class="d-flex align-items-center gap-2">
            <div class="dropdown user-dropdown">
                <button
                    class="btn-user-menu dropdown-toggle d-inline-flex align-items-center gap-2"
                    type="button"
                    data-bs-toggle="dropdown"
                    aria-expanded="false">
                    <div class="user-avatar">
                        <i class="bi bi-person-circle"></i>
                    </div>
                    <div class="user-info d-none d-sm-flex flex-column align-items-start">
                        <span class="user-name">{{ user()?.nombre || 'Usuario' }}</span>
                        <span class="user-role">Repartidor</span>
                    </div>
                    <i class="bi bi-chevron-down chevron-icon"></i>
                </button>
                <ul class="dropdown-menu dropdown-menu-end dropdown-menu-animated">
                    <li class="dropdown-header">
                        <div class="d-flex align-items-center gap-2">
                            <i class="bi bi-person-circle fs-4"></i>
                            <div>
                                <div class="fw-semibold">{{ user()?.nombre || 'Usuario' }}</div>
                                <small class="text-muted">{{ user()?.email || 'repartidor@email.com' }}</small>
                            </div>
                        </div>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <a class="dropdown-item" routerLink="/repartidor">
                            <i class="bi bi-box-seam me-2"></i>Asignaciones
                        </a>
                    </li>
                    <li>
                        <a class="dropdown-item" routerLink="/repartidor/perfil">
                            <i class="bi bi-person me-2"></i>Perfil
                        </a>
                    </li>
                    <li><hr class="dropdown-divider"></li>
                    <li>
                        <button class="dropdown-item text-danger" type="button" (click)="onLogout()">
                            <i class="bi bi-box-arrow-right me-2"></i>Cerrar sesión
                        </button>
                    </li>
                </ul>
            </div>
        </div>
    </div>
</header>
