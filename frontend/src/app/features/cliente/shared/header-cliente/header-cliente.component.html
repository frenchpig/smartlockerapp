<header class="bg-success text-white py-3 shadow-sm">
    <div class="container d-flex align-items-center justify-content-between flex-wrap gap-3">
        <div class="d-flex align-items-center gap-3">
            <h1 class="h5 mb-0 fw-bold">{{ titulo }}</h1>

            <nav class="d-none d-md-flex gap-2">
                <a routerLink="/cliente" routerLinkActive="active" [routerLinkActiveOptions]="{exact: true}"
                    class="nav-link-custom">
                    <i class="bi bi-house-door me-1"></i> Inicio
                </a>
                <a routerLink="/cliente/mis-pedidos" routerLinkActive="active" class="nav-link-custom">
                    <i class="bi bi-list-ul me-1"></i> Mis Pedidos
                </a>
            </nav>
        </div>

        <div class="d-flex align-items-center gap-2">
            <app-user-menu-button
                [userRole]="'Cliente'"
                [menuItems]="menuItems"
                (logout)="onLogout()">
            </app-user-menu-button>
        </div>
    </div>
</header>

<!-- Modal de incidencia a nivel global -->
<app-modal-incidencia></app-modal-incidencia>
