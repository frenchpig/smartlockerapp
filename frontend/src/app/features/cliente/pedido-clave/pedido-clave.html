<main class="container my-4" role="main">

    <div class="mx-auto text-center" style="max-width: 560px">

        <header class="mb-3">
            <h2 class="h5 fw-semibold mb-1">Pedido #{{ pedido?.id }}</h2>
            <p class="text-muted mb-0">
                <span class="dot ok" aria-hidden="true"></span>
                <span class="ms-1">Locker <strong>{{ pedido?.locker }}</strong></span> ·
                <span>{{ pedido?.sede }}</span> ·
                <time [attr.datetime]="pedido?.creadoEl">{{ pedido?.creadoEl | date:'medium' }}</time>
            </p>
        </header>

        <div class="pin-dots" role="group" aria-label="Dígitos ingresados">
            <span class="span_dot" *ngFor="let i of [0,1,2,3,4,5]" [class.filled]="(clave.value?.length ?? 0) > i">
            </span>
        </div>

        <div class="mx-auto" style="max-width: 420px">
            <div class="row g-3">
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('1')">1</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('2')">2</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('3')">3</button></div>

                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('4')">4</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('5')">5</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('6')">6</button></div>

                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('7')">7</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('8')">8</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('9')">9</button></div>

                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4" (click)="limpiar()"
                        aria-label="Limpiar"><i class="bi bi-x-circle"></i></button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4"
                        (click)="press('0')">0</button></div>
                <div class="col-4"><button class="btn btn-outline-secondary w-100 py-3 fs-4" (click)="borrar()"
                        aria-label="Borrar"><i class="bi bi-backspace"></i></button></div>
            </div>
        </div>

        <div class="d-flex justify-content-center gap-2 flex-wrap mt-4">
            <button type="button" class="btn btn-success btn-lg px-4" [disabled]="!lleno || enviando"
                (click)="enviar()">
                <i class="bi bi-unlock me-1"></i> Abrir locker
            </button>
            <a class="btn btn-outline-secondary btn-lg px-4" [routerLink]="['/cliente']">Cancelar</a>
        </div>
        <!-- QR (solo se muestra si qrData tiene contenido) -->
        <section *ngIf="qrData" class="qr-wrap text-center mt-4" aria-labelledby="qr-title">
            <h3 id="qr-title" class="h6 mb-2">Tu código QR</h3>
            <qrcode [qrdata]="qrData" [width]="220" [errorCorrectionLevel]="'M'"></qrcode>
            <p class="text-muted mt-2" *ngIf="expiresAt">
                Válido hasta <time [attr.datetime]="expiresAt">{{ expiresAt | date:'mediumTime' }}</time>
            </p>
        </section>


    </div>
</main>
<footer class="border-top bg-white text-center py-3 mt-5">
    <small class="text-muted">&copy; 2025 Smart Lockers</small>
</footer>
